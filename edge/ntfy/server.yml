# ntfy, the alert path for every site in this repo. status and logging publish
# over the bridge with a write-only token, and a phone reads over the tunnel at
# ntfy.bythewood.me with a separate read-only account.
#
# Publishing is fenced to the bridge by Caddy rather than by anything in here,
# because ntfy has no way to restrict an account by source address. That is the
# fact to remember before trying to solve it again in this file.

# 8000 like every other container in this repo. ntfy's own default is :80.
listen-http: ":8000"

# What a click link in a notification has to resolve to from anywhere.
base-url: "https://ntfy.bythewood.me"

# So messages survive a restart and a phone that was offline. The default is 12h,
# and a day covers a weekend away from signal at a handful of alerts a month.
cache-file: "/var/lib/ntfy/cache.db"
cache-duration: "24h"

# deny-all means an anonymous request can neither read nor publish, on any topic.
# Two accounts exist, created by setup-ntfy.sh: isaac reads status and logging,
# orchard writes them with a token that lives in each site's .env.
auth-file: "/var/lib/ntfy/user.db"
auth-default-access: "deny-all"

# Attachments are off (no attachment-cache-dir), so nothing here accepts a file
# upload.

# No web app. ntfy serves a full single-page client at / by default, and the only
# clients here are an Android app and two Go programs, neither of which reads any
# of it.
web-root: "disable"

# X-Forwarded-For is NOT trusted, even though Caddy sets it, since trusting it
# would let a publisher spoof its own address. Rate limits count against the peer
# address instead, the bridge for publishers and Caddy for readers.
behind-proxy: false

# Machine to machine, and every publish is already recorded by the site that made
# it.
log-level: "warn"
