name: orchard-edge

# The shared edge: one tunnel and one Caddy in front of every site in this repo,
# plus the ntfy every alert is published to. cloudflared's state lives in a named
# volume seeded by setup-tunnel.sh rather than a bind mount off the host.

services:
  caddy:
    build: ./caddy
    container_name: orchard-caddy
    restart: unless-stopped
    networks: [edge]
    security_opt:
      - no-new-privileges:true
    # Caddy access-logs every request for every hostname, so without this the
    # container log is the one unbounded thing in the system.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # The alert path. status and logging publish by container name on this bridge
  # with a write-only token, and a phone reads over the tunnel with a read-only
  # account. setup-ntfy.sh creates both, and the config is in ntfy/server.yml.
  ntfy:
    build: ./ntfy
    container_name: orchard-ntfy
    restart: unless-stopped
    command: serve
    volumes:
      - ntfy:/var/lib/ntfy
    # No published port, like every site here. Caddy allows the subscribe routes
    # on the public hostname and refuses every publish route.
    networks: [edge]
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8000/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  cloudflared:
    image: cloudflare/cloudflared:2026.8.3@sha256:9be48e4b4e996da851bf78f7782bfab150dd4d8889e469d004802e7d7afb63b1
    container_name: orchard-cloudflared
    restart: unless-stopped
    command: tunnel --config /etc/cloudflared/config.yml run
    volumes:
      - cloudflared:/etc/cloudflared:ro
    networks: [edge]
    depends_on: [caddy]
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  edge:
    name: orchard-edge

volumes:
  # Created and populated by setup-tunnel.sh before this stack first runs, so
  # compose attaches to it rather than owning it.
  cloudflared:
    name: orchard-cloudflared
    external: true

  # Data rather than cache: cache.db holds alerts already delivered so an
  # offline phone catches up, and user.db holds the two accounts. Lose this and
  # setup-ntfy.sh has to run again and both publishers need a new token.
  ntfy:
    name: orchard-ntfy-data
