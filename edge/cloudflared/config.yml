# Locally-managed tunnel, so this file is the source of truth rather than a
# dashboard. Only credentials-file is secret, and it never leaves the volume.

tunnel: CHANGEME_TUNNEL_ID
credentials-file: /etc/cloudflared/CHANGEME_TUNNEL_ID.json

# One rule per hostname, all terminating at Caddy, which owns the per-site
# routing. The catch-all at the end is required by cloudflared.
ingress:
  - hostname: isaacbythewood.com
    service: http://caddy:80
  - hostname: www.isaacbythewood.com
    service: http://caddy:80
  - hostname: blog.bythewood.me
    service: http://caddy:80
  - hostname: analytics.bythewood.me
    service: http://caddy:80
  - hostname: auth.bythewood.me
    service: http://caddy:80
  - hostname: status.bythewood.me
    service: http://caddy:80
  - hostname: logging.bythewood.me
    service: http://caddy:80
  - hostname: ntfy.bythewood.me
    service: http://caddy:80
  - hostname: repos.bythewood.me
    service: http://caddy:80
  - hostname: dash.bythewood.me
    service: http://caddy:80
  - hostname: chat.bythewood.me
    service: http://caddy:80
  - hostname: llm.bythewood.me
    service: http://caddy:80

  # The apex has never served a site. Caddy owns the redirect to the portfolio.
  - hostname: bythewood.me
    service: http://caddy:80
  - hostname: www.bythewood.me
    service: http://caddy:80

  - service: http_status:404

# Loopback only, since the same port serves /debug/pprof, /config and
# /diag/tunnel to anything that can reach it.
metrics: 127.0.0.1:2000
