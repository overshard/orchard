{{ define "form" }}
<span class="o-lab">sign in &middot; step 1 of 2</span>
<h1>Who's signing in?</h1>
<p class="o-muted">A six digit code goes to the phone for that account.</p>

{{ template "alerts" . }}

<form method="POST" action="/login" class="signin-form">
  <input type="hidden" name="next" value="{{ .Next }}">
  <label class="o-field">
    <span>Username</span>
    <input type="text" name="username" id="id_username" required autofocus
           autocomplete="username" autocapitalize="none" spellcheck="false">
  </label>
  <div class="o-formbar">
    <button type="submit" class="o-btn o-btn-p">Send a code &rarr;</button>
    <span class="o-sp"></span>
    <a href="/recovery?next={{ .Next | urlquery }}" class="o-muted small">Use a recovery code</a>
  </div>
</form>
{{ end }}

{{ define "main" }}{{ template "authShell" . }}{{ end }}
