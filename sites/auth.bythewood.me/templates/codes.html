{{ define "main" }}
<div class="container-fluid px-4 py-4">
  <div class="page-head">
    <div>
      <div class="auth-eyebrow">write these down</div>
      <h1 class="page-title">{{ .Title }}</h1>
    </div>
    <button type="button" class="btn btn-outline-light btn-sm" data-copy="#code-set">Copy all</button>
  </div>

  <div class="panel" style="max-width: 46rem;">
    <p class="auth-hint mt-0">These are the only copies, and leaving this page is the last time they
      exist anywhere readable. Every previous code stopped working just now.</p>
    <div class="codes" id="code-set">
      {{ range .NewCodes }}<div class="code-chip">{{ . }}</div>{{ end }}
    </div>
    <a href="/security" class="btn btn-primary btn-sm">I have saved them →</a>
  </div>
</div>
{{ end }}
