{{ define "main" }}
<main id="main" class="o-wrap o-main">
  <div class="o-ph">
    <div>
      <span class="o-lab">auth &middot; write these down</span>
      <h1>Ten new <em>recovery codes</em>.</h1>
      <p>These are the only copies, and leaving this page is the last time they exist anywhere readable. Every old code stopped working just now.</p>
    </div>
    <div class="o-acts"><button type="button" class="o-btn o-btn-sm" data-copy="#code-set">Copy all</button></div>
  </div>

  <section class="o-panel codes-panel">
    <div class="codes" id="code-set">
      {{ range .NewCodes }}<div class="code-chip o-mono">{{ . }}</div>{{ end }}
    </div>
    <div class="o-formbar"><span class="o-sp"></span><a href="/security" class="o-btn o-btn-p o-btn-sm">I've saved them &rarr;</a></div>
  </section>
</main>
{{ end }}
