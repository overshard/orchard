{{ define "form" }}
<div class="section-label mb-2">bythewood.me</div>
<h1 class="fw-bolder text-white mb-4" style="letter-spacing: -0.01em; font-size: 1.9rem;">{{ .Title }}</h1>

{{ template "alerts" . }}

<form method="POST" action="/recovery">
  <input type="hidden" name="next" value="{{ .Next }}">
  <div class="form-floating mb-3">
    <input type="text" class="form-control" name="code" id="id_recovery"
           placeholder="xxxx-xxxx-xxxx" required autofocus
           autocomplete="off" autocapitalize="none" spellcheck="false">
    <label for="id_recovery">Recovery code</label>
  </div>
  <div class="d-flex justify-content-between align-items-center mt-4">
    <button type="submit" class="btn btn-primary">Sign in →</button>
    <a href="/login" class="small link-footer">Back</a>
  </div>
</form>
{{ end }}

{{ define "main" }}{{ template "authShell" . }}{{ end }}
