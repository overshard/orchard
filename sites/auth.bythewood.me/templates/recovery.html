{{ define "form" }}
<div class="auth-eyebrow">bythewood.me</div>
<h1 class="auth-title">{{ .Title }}</h1>

{{ template "alerts" . }}

<form method="POST" action="/recovery">
  <input type="hidden" name="next" value="{{ .Next }}">
  <div class="form-floating">
    <input type="text" class="form-control" name="code" id="id_recovery"
           placeholder="xxxx-xxxx-xxxx" required autofocus
           autocomplete="off" autocapitalize="none" spellcheck="false">
    <label for="id_recovery">Recovery code</label>
  </div>
  <div class="auth-actions">
    <button type="submit" class="btn btn-primary">Sign in →</button>
    <a href="/login" class="small link-footer">Back</a>
  </div>
</form>
{{ end }}

{{ define "main" }}{{ template "authShell" . }}{{ end }}
