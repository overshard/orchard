name: orchard-analytics

# No published ports. Traffic arrives through cloudflared to Caddy on the shared
# network. State is a named volume, not a bind mount: the Docker CLI here talks
# to Docker Desktop, which mounts a /home/dev path empty instead of erroring.

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: orchard-analytics
    restart: unless-stopped
    # Longer than Docker's 10s default, because shutdown drains the log shipper
    # queue and commits what the writer holds. Without it a slow drain means
    # SIGKILL and a skipped db.Close().
    stop_grace_period: 30s
    environment:
      # Read from .env in this directory, which compose picks up as the project
      # directory. :? makes compose refuse to start rather than bring up a
      # server the app would then refuse to boot.
      ANALYTICS_PASSWORD: ${ANALYTICS_PASSWORD:?set ANALYTICS_PASSWORD in this directory's .env; see .env.example}
    volumes:
      - data:/data
    # A ceiling to fail against rather than a target, since this machine is also
    # a workstation. Roomier than the static sites because of the 131MB GeoIP
    # mmdb and the Typst report renders.
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 512M
    # The binary probes itself, since the scratch images here have no shell for a
    # check to call, and `restart` only catches a process that has exited.
    healthcheck:
      test: ["CMD", "/app", "-healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    # Otherwise container logs grow unbounded on a workstation.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks: [edge]

volumes:
  data:
    name: orchard-analytics-data

networks:
  edge:
    name: orchard-edge
    external: true
