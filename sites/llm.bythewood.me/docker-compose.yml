name: orchard-llm

# The gateway is on the edge network so Caddy and every other site can reach it.
# With ANTHROPIC_API_KEY in .env it answers from Claude and runs alone. Without
# one, COMPOSE_PROFILES=local in .env brings up the model server and gpu probe.

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: orchard-llm
    restart: unless-stopped
    # Longer than Docker's ten second default so a generation in flight finishes
    # and the call log closes cleanly rather than being killed mid write.
    stop_grace_period: 30s
    environment:
      LOGGING_TOKEN: ${LOGGING_TOKEN:?run make logging-token}
      LLM_UPSTREAM: http://swap:8091
      LLM_GPU: http://gpu:8092
      LLM_MODEL: local
      LLM_DB: /data/llm.db
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # The month's Claude budget in dollars, and the ntfy token for spend
      # alerts, the same one status and logging hold.
      LLM_BUDGET: ${LLM_BUDGET:-100}
      NTFY_TOKEN: ${NTFY_TOKEN:-}
    volumes:
      - data:/data
    depends_on:
      swap:
        condition: service_healthy
        required: false
      gpu:
        condition: service_healthy
        required: false
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 512M
          pids: 128
    security_opt:
      - no-new-privileges:true
    read_only: true
    cap_drop: [ALL]
    tmpfs: [/tmp]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks: [edge, model]

  # llama.cpp and stable-diffusion.cpp behind llama-swap with the card attached.
  # Ornith 1.5 9B for chat and FLUX.2 klein 9B for pictures, one at a time, each
  # unloaded after three idle minutes so the desktop gets its card back.
  swap:
    build:
      context: ./modelserver
      dockerfile: Dockerfile
    container_name: orchard-llm-swap
    profiles: [local]
    restart: unless-stopped
    volumes:
      - models:/models
    deploy:
      resources:
        limits:
          pids: 256
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    # /v1/models answers from llama-swap's own config and loads nothing, so this
    # never keeps the model awake. libcuda is in the driver store only while the
    # CDI spec names the store Windows has now.
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8091/v1/models >/dev/null && test -e /usr/lib/wsl/drivers/*/libcuda.so.1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks: [model]

  # nvidia-smi with the utility capability and nothing else, so the gateway can
  # say whether the desktop is using the card before a timed caller loads a model.
  gpu:
    build:
      context: .
      dockerfile: gpuprobe/Dockerfile
    container_name: orchard-llm-gpu
    profiles: [local]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 64M
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [utility]
    healthcheck:
      test: ["CMD", "/gpuprobe", "-healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks: [model]

volumes:
  data:
    name: orchard-llm-data
  models:
    name: orchard-llm-models

networks:
  edge:
    name: orchard-edge
    external: true
  # Internal, since the weights are on the volume and nothing here needs the internet.
  model:
    name: orchard-llm-model
    internal: true
