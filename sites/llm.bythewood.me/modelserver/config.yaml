# llama-swap: one model, started on demand and unloaded when idle.
#
# The ttl is the point of this file, since this machine is also a workstation
# and without it the weights sit on the card forever. A cold start takes a few
# seconds, so three minutes is short and being wrong costs little.

healthCheckTimeout: 600
logLevel: info
startPort: 10001

# The GPU monitor keeps nvidia-smi polling the card every few seconds,
# which can stutter a game running on the same card.
performance:
  disabled: true

models:
  # Every caller asks for "local", so this name is the contract across the
  # whole estate and swapping the weights underneath is one line here.
  "local":
    name: "Ornith 1.5 9B"
    ttl: 180
    # 64k with a q4_0 cache is what fits on the 8GB card beside a live desktop.
    # A q8_0 cache is no faster, and it or 128k crowds out the desktop's own use.
    #
    # Q4_K_M because it is the smallest quant this model's publisher ships.
    # There is no Unsloth dynamic build for 1.5, and Q5_K_M is 820 MiB heavier,
    # which would cap context near 16k.
    #
    # A path on the volume rather than -hf, so the one service every other one
    # depends on does not need HuggingFace to be reachable to start.
    #
    # Reasoning off unless a caller asks for it with enable_thinking, so one
    # that never says gets a plain answer and not a chain of thought.
    cmd: >
      llama-server
      --host 127.0.0.1 --port ${PORT}
      -m /models/ornith/Ornith-1.5-9B-Q4_K_M.gguf
      --n-gpu-layers 999
      --flash-attn on
      --parallel 1
      --jinja
      --reasoning off
      --ctx-size 65536
      --cache-type-k q4_0
      --cache-type-v q4_0
      --ubatch-size 256

  # Images. Only one entry runs at a time, so asking for this takes Ornith off
  # the card and the next chat turn puts it back.
  "image":
    name: "FLUX.2 klein 9B"
    ttl: 180
    # sd-server has no /health, and it loads the weights before it listens, so
    # the model list answering means it is ready to draw.
    checkEndpoint: /v1/models
    # Q4_K_M because Q8_0 is 10GB and cannot go on an 8GB card whole. 9B needs
    # its own encoder, Qwen3 8B, and offload-to-cpu keeps both in RAM and puts
    # each on the card only while it runs, so they never have to fit together.
    # A full size VAE decode runs out of memory and retries tiled anyway.
    cmd: >
      sd-server
      --listen-ip 127.0.0.1 --listen-port ${PORT}
      --diffusion-model /models/klein9b/flux-2-klein-9b-Q4_K_M.gguf
      --llm /models/klein9b/Qwen3-8B-Q4_K_M.gguf
      --vae /models/klein/flux2-vae.safetensors
      --steps 4
      --cfg-scale 1.0
      --diffusion-fa
      --offload-to-cpu
      --vae-tiling
