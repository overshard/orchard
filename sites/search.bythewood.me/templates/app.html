<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ask &middot; search</title>
<link rel="stylesheet" href="{{ asset "static/app.css" }}">
</head>
<body data-session="{{.SessionID}}">
<div class="crt"></div>
<div class="vignette"></div>

<header class="bar">
  <div class="barin">
    <a class="brand" href="/">
      <span class="key"><span class="cursor"></span></span>
      <span>search</span>
    </a>
    <span class="where">Ask</span>
    <span class="spacer"></span>
    <span class="counts" id="archive"><b>{{ num .Pages }}</b> pages &middot; <b>{{ num .Chunks }}</b> passages</span>
    <span class="gauge" id="gauge" title="How much searching is left before it paces itself">
      <span class="segs" id="segs"></span>
      <span class="gtext" id="gtext">ready</span>
    </span>
    <button class="ghost" id="reset" title="Start a new conversation">new</button>
    <span class="dot {{if .LLMUp}}up{{end}}" id="modeldot" title="model"></span>
  </div>
</header>

<main>
  <div class="askwrap">
    <form class="ask" id="ask">
      <input type="text" id="q" placeholder="Ask a question" autocomplete="off">
      <button type="submit" id="go">Search</button>
    </form>
    <p class="faint hint" id="followhint" hidden>Following on from the last answer. Use <strong>New question</strong> to start fresh.</p>
    <p class="hint capnote" id="capnote" hidden></p>
  </div>

  <div id="transcript">
    <div class="intro">
      <p class="introline">Ask a question. It searches the web, reads what it finds, and writes an
      answer where every sentence is checked against the passage it cites.</p>

      <div class="skills">
        <div class="skhead">
          <span class="label">try</span>
          <span class="skrule"></span>
        </div>
        <ul class="skillrow">
          <li><button class="skill" data-q="how do i make a breakfast burrito">
            <span class="skname">recipe</span>
            <span class="skex">how do i make a breakfast burrito</span>
          </button></li>
          <li><button class="skill" data-q="how do i set up wireguard on debian">
            <span class="skname">how&#8209;to</span>
            <span class="skex">how do i set up wireguard on debian</span>
          </button></li>
          <li><button class="skill" data-q="sqlite vs postgres for a small site">
            <span class="skname">compare</span>
            <span class="skex">sqlite vs postgres for a small site</span>
          </button></li>
          <li><button class="skill" data-q="most popular tool for running LLMs locally">
            <span class="skname">find</span>
            <span class="skex">most popular tool for running LLMs locally</span>
          </button></li>
          <li><button class="skill" data-q="did Liverpool win their last match">
            <span class="skname">scores</span>
            <span class="skex">did Liverpool win their last match</span>
            <span class="sktag">live</span>
          </button></li>
          <li><button class="skill" data-q="what is the status of the Artemis moon program">
            <span class="skname">status</span>
            <span class="skex">what is the status of the Artemis moon program</span>
          </button></li>
          <li><button class="skill" data-q="what is the weather this weekend">
            <span class="skname">weather</span>
            <span class="skex">what is the weather this weekend</span>
            <span class="sktag">live</span>
          </button></li>
          <li><button class="skill" data-q="what is the S&amp;P 500 right now">
            <span class="skname">markets</span>
            <span class="skex">what is the S&amp;P 500 right now</span>
            <span class="sktag">live</span>
          </button></li>
          <li><button class="skill" data-q="what are the odds on the us open">
            <span class="skname">odds</span>
            <span class="skex">what are the odds on the us open</span>
            <span class="sktag">live</span>
          </button></li>
          <li><button class="skill" data-q="100 usd in eur">
            <span class="skname">convert</span>
            <span class="skex">100 usd in eur</span>
          </button></li>
          <li><button class="skill" data-q="what time is it in tokyo">
            <span class="skname">time</span>
            <span class="skex">what time is it in tokyo</span>
            <span class="sktag">instant</span>
          </button></li>
          <li><button class="skill" data-q="30 * 27">
            <span class="skname">maths</span>
            <span class="skex">30 * 27</span>
            <span class="sktag">instant</span>
          </button></li>
        </ul>
      </div>

      <p class="ambient">{{.Ambient}}</p>
    </div>
  </div>
</main>

<script src="{{ asset "static/app.js" }}"></script>
</body>
</html>
