name: orchard-search

# One service. The model lives behind llm.bythewood.me now, so this site holds
# no weights and asks for no GPU, and the key in .env is what lets it through
# that gateway. Two services here meant a second copy of the weights on an 8GB
# card, so whichever of search and chat you used last evicted the other.
#
# No published ports. Caddy reaches the app by container name on orchard-edge.

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: orchard-search
    restart: unless-stopped
    # Longer than Docker's 10s default so an answer in flight finishes and the
    # database closes cleanly rather than being killed mid-write.
    stop_grace_period: 30s
    environment:
      LLM_URL: http://orchard-llm:8000
      LLM_KEY: ${LLM_KEY:?create a key at llm.bythewood.me and put it in .env}
    volumes:
      - data:/data
    # Roomier than the static sites: this one holds a page archive with a full
    # text index and parses HTML on the request path. Still a ceiling to fail
    # against rather than a target, since this machine is also a workstation.
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 512M
    healthcheck:
      test: ["CMD", "/app", "-healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks: [edge]

volumes:
  data:
    name: orchard-search-data

networks:
  edge:
    name: orchard-edge
    external: true
