name: orchard-repos

# A volume since the daemon is on the host and mounts a /home/dev path empty
# instead of erroring. It is primary data, holding
# the only copy of repositories that exist nowhere else, so restic covers it.

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: orchard-repos
    restart: unless-stopped
    environment:
      LOGGING_TOKEN: ${LOGGING_TOKEN:?run make logging-token}
    env_file: .env
    volumes:
      - data:/data
    # Longer than Docker's 10s default, so a shutdown mid-push lets the
    # receive-pack subprocess finish rather than leave a half-written pack and a
    # stale lock.
    stop_grace_period: 30s
    # git leaves children behind that nothing reaps without an init as PID 1,
    # and they pile up as zombies until the container hits its process limit.
    init: true
    # A ceiling to fail against rather than a target. Roomier than the static
    # sites because a push runs `git index-pack`, and a mirror clone of a 130MB
    # repository can run alongside it.
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 512M
          pids: 128
    healthcheck:
      test: ["CMD", "/app", "-healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    read_only: true
    cap_drop: [ALL]
    # A push is spooled here whole before git reads it, up to 100MB.
    tmpfs: ["/tmp:size=128m,noexec,nosuid,nodev"]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks: [edge]

volumes:
  data:
    name: orchard-repos-data

networks:
  edge:
    name: orchard-edge
    external: true
