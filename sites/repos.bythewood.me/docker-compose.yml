name: orchard-repos

# A volume, not a bind mount: the Docker CLI here talks to Docker Desktop, which
# mounts a /home/dev path empty instead of erroring. It is primary data, holding
# the only copy of repositories that exist nowhere else, so restic covers it.

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: orchard-repos
    restart: unless-stopped
    env_file: .env
    volumes:
      - data:/data
    # Longer than Docker's 10s default, so a shutdown mid-push lets the
    # receive-pack subprocess finish rather than leave a half-written pack and a
    # stale lock.
    stop_grace_period: 30s
    # A ceiling to fail against rather than a target. Roomier than the static
    # sites because a push runs `git index-pack`, and a mirror clone of a 130MB
    # repository can run alongside it.
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 512M
    healthcheck:
      test: ["CMD", "/app", "-healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks: [edge]

volumes:
  data:
    name: orchard-repos-data

networks:
  edge:
    name: orchard-edge
    external: true
