name: orchard-repos

# A volume, not a bind mount. The Docker CLI here talks to Docker Desktop on the
# Windows host, whose daemon resolves paths against its own filesystem, where
# /home/dev/code does not exist; a bind mount fails silently as an empty mount
# rather than erroring.
#
# The volume is primary data. It holds the only copy of the repositories that
# exist nowhere else, so it belongs in the restic run, unlike analytics and
# status whose volumes are re-derivable.

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: orchard-repos
    restart: unless-stopped
    env_file: .env
    volumes:
      - data:/data
    # Longer than Docker's 10s default: a shutdown mid-push should let the
    # receive-pack subprocess finish writing rather than leave a repository
    # holding a half-written pack and a stale lock.
    stop_grace_period: 30s
    # Roomier than the static sites because a push runs `git index-pack`, which
    # is the one genuinely memory-hungry thing here, and a mirror clone of a
    # 130MB repository runs alongside it. A limit is a ceiling to fail against,
    # not a target.
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 512M
    healthcheck:
      test: ["CMD", "/app", "-healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks: [edge]

volumes:
  data:
    name: orchard-repos-data

networks:
  edge:
    name: orchard-edge
    external: true
