{{define "content"}}
{{$d := .Data}}
<div class="loginbox">
  <h1>Sign in</h1>
  <p class="hint">Signing in is only needed to mint push tokens and edit descriptions. Browsing and cloning are open to everyone.</p>
  {{if $d.Error}}<p class="error">{{$d.Error}}</p>{{end}}
  <form method="post" action="/login">
    <input type="hidden" name="next" value="{{$d.Next}}">
    <label>Password
      <input type="password" name="password" autocomplete="current-password" autofocus required>
    </label>
    <button type="submit">Sign in</button>
  </form>
</div>
{{end}}
