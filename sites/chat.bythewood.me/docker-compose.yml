name: orchard-chat

# The model lives behind llm.bythewood.me now, so this site holds no weights and
# asks for no GPU, and the key in .env is what lets it through that gateway.

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: orchard-chat
    restart: unless-stopped
    # Longer than Docker's 10s default so a turn in flight finishes and the
    # database closes cleanly rather than being killed mid write.
    stop_grace_period: 30s
    environment:
      LLM_URL: http://orchard-llm:8000
      LLM_KEY: ${LLM_KEY:?create a key at llm.bythewood.me and put it in .env}
      CHAT_DB: /data/chat.db
      # The house lookups. The config carries a work address, a budget and a
      # school run, so it lives in the volume beside the database and never in
      # this repository. Without it the reports still answer and say they ran on
      # placeholders.
      PROPERTY_CONFIG: /data/property.json
      # Reported crime, the one fact on a report with no keyless route to it.
      # Free and instant at api.data.gov, and without it the crime lines say
      # they have no figures rather than guessing.
      FBI_API_KEY: ${FBI_API_KEY:-}
    volumes:
      - data:/data
    deploy:
      resources:
        limits:
          cpus: "1.00"
          # A cold property report fires eight lookups at once and some of the
          # payloads are megabytes, which 512M did not leave room for.
          memory: 768M
          pids: 256
    security_opt:
      - no-new-privileges:true
    read_only: true
    cap_drop: [ALL]
    tmpfs: [/tmp]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks: [edge]

volumes:
  data:
    name: orchard-chat-data

networks:
  edge:
    name: orchard-edge
    external: true
