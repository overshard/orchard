name: orchard-status

# No bind mounts and no published ports. Public traffic arrives through
# cloudflared to Caddy on the shared network.

services:
  app:
    build:
      # This directory and nothing above it. The site is its own Go module
      # with its own copy of web/, so there is no parent to reach for.
      context: .
      dockerfile: Dockerfile
    container_name: orchard-status
    restart: unless-stopped
    # Longer than Docker's 10s default, because shutdown now does real work:
    # the log shipper drains its queue and the writer commits what it holds.
    # Both are bounded well inside this, so the grace is headroom rather than
    # a deadline anything relies on. Without it a slow drain meant SIGKILL and
    # a skipped db.Close().
    stop_grace_period: 30s
    # Chromium spawns a tree of processes for every audit. Without an init as
    # PID 1 those become zombies that nothing reaps, and a daily audit
    # accumulates them until the container hits its process limit.
    # lighthouse.go's process-group kill handles the timeout case; this handles
    # the ordinary one.
    init: true
    environment:
      # The one genuine secret in the system, and the only environment variable
      # this app reads. Taken from the deploying shell rather than an .env file
      # so it is never written next to the repo; :? makes compose refuse to
      # start rather than bring up a server the app would then refuse to boot.
      STATUS_PASSWORD: ${STATUS_PASSWORD:?set STATUS_PASSWORD in the deploying shell}
    volumes:
      - data:/data
    # Nothing here has needed more than 36MB at rest, but this machine is also
    # a workstation, so a runaway process costs twice. A limit is a ceiling to
    # fail against, not a target.
    deploy:
      resources:
        limits:
        # The high ceiling is Chromium. Lighthouse audits are the only thing
        # here that can spike, and an OOM kill mid-audit would leave a property
        # looking down when it is not.
          cpus: "2.00"
          memory: 1536M
    # The binary probes itself, because two of these images are FROM scratch
    # and have no shell for a check to call. `restart` alone only catches a
    # process that exits; this catches one that is merely wedged.
    healthcheck:
      test: ["CMD", "/app", "-healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    # Unbounded container logs on a machine that is also a workstation.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks: [edge]

volumes:
  data:
    name: orchard-status-data

networks:
  edge:
    name: orchard-edge
    external: true
