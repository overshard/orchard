name: orchard-status

# No published ports. Traffic arrives through cloudflared to Caddy on the shared
# network.

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: orchard-status
    restart: unless-stopped
    # Longer than Docker's 10s default, because shutdown drains the log shipper
    # queue and commits what the writer holds. Without it a slow drain means
    # SIGKILL and a skipped db.Close().
    stop_grace_period: 30s
    environment:
      LOGGING_TOKEN: ${LOGGING_TOKEN:?run make logging-token}
      # Read from .env in this directory, which compose picks up as the project
      # directory. Write-only ntfy token, and an empty one is tolerated: refusing to start
      # over a missing alert credential would turn a quiet notification into an
      # outage.
      NTFY_TOKEN: ${NTFY_TOKEN:-}
    volumes:
      - data:/data
    # A ceiling to fail against rather than a target. An OOM kill mid-check
    # would leave a property looking down when it is not, so typst renders and
    # a crawl's worth of pages in memory set the size.
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
          pids: 128
    # The binary probes itself, since the scratch images here have no shell for a
    # check to call, and `restart` only catches a process that has exited.
    healthcheck:
      test: ["CMD", "/app", "-healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    read_only: true
    cap_drop: [ALL]
    tmpfs: [/tmp]
    # Otherwise container logs grow unbounded on a workstation.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks: [edge]

volumes:
  data:
    name: orchard-status-data

networks:
  edge:
    name: orchard-edge
    external: true
