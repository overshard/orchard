name: orchard-status

# No published ports. Traffic arrives through cloudflared to Caddy on the shared
# network.

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: orchard-status
    restart: unless-stopped
    # Longer than Docker's 10s default, because shutdown drains the log shipper
    # queue and commits what the writer holds. Without it a slow drain means
    # SIGKILL and a skipped db.Close().
    stop_grace_period: 30s
    # Chromium spawns a tree of processes per audit, and without an init as PID 1
    # they become zombies that nothing reaps until the container hits its process
    # limit. lighthouse.go's process-group kill covers the timeout case only.
    init: true
    environment:
      # Read from .env in this directory, which compose picks up as the project
      # directory. Write-only ntfy token, and an empty one is tolerated: refusing to start
      # over a missing alert credential would turn a quiet notification into an
      # outage.
      NTFY_TOKEN: ${NTFY_TOKEN:-}
    volumes:
      - data:/data
    # A ceiling to fail against rather than a target, since this machine is also
    # a workstation. The high one here is Chromium: an OOM kill mid-audit would
    # leave a property looking down when it is not.
    deploy:
      resources:
        limits:
          cpus: "2.00"
          memory: 1536M
    # The binary probes itself, since the scratch images here have no shell for a
    # check to call, and `restart` only catches a process that has exited.
    healthcheck:
      test: ["CMD", "/app", "-healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    # Otherwise container logs grow unbounded on a workstation.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks: [edge]

volumes:
  data:
    name: orchard-status-data

networks:
  edge:
    name: orchard-edge
    external: true
