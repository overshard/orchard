name: blog

# No bind mounts and no published ports. Public traffic arrives through
# cloudflared to Caddy on the shared network, and there is no state to persist:
# posts are files baked into the image, and there is no database and no upload.
#
# Bind mounts would not work from the webdev container anyway. The Docker CLI
# here talks to Docker Desktop on the Windows host, whose daemon resolves paths
# against its own filesystem, where /home/dev/code does not exist. It fails
# silently as an empty mount rather than erroring.

services:
  app:
    build:
      # This directory and nothing above it. The site is its own Go module
      # with its own copy of web/, so there is no parent to reach for.
      context: .
      dockerfile: Dockerfile
    container_name: blog-next
    restart: unless-stopped
    # Nothing here has ever needed more than 36MB at rest, but this machine is
    # also the desktop Isaac works on, so a runaway process is his problem
    # twice over. Limits are a ceiling to fail against, not a target.
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 192M
    # The binary probes itself: two of these images are FROM scratch and have
    # no shell or curl for a check to shell out to. restart alone only catches
    # a process that exits; this is what catches one that is merely wedged.
    healthcheck:
      test: ["CMD", "/app", "-healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    # Unbounded container logs on a machine that is also a workstation.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks: [edge]

networks:
  edge:
    name: orchard-edge
    external: true
