name: orchard-logging

# No published ports, and /ingest is reachable only by container name on the
# shared network, which is why it needs no token. The volume is the fastest
# growing one here, so retention is enforced by the process itself.

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: orchard-logging
    restart: unless-stopped
    # Longer than Docker's 10s default, because shutdown drains the log shipper
    # queue and commits what the writer holds. Without it a slow drain means
    # SIGKILL and a skipped db.Close().
    stop_grace_period: 30s
    environment:
      # Read from .env in this directory, which compose picks up as the project
      # directory. Write-only ntfy token, and an empty one is tolerated: refusing to start
      # over a missing alert credential would turn a quiet notification into an
      # outage.
      NTFY_TOKEN: ${NTFY_TOKEN:-}
    volumes:
      - data:/data
    # A ceiling to fail against rather than a target, since this machine is also
    # a workstation. Roomier than the static sites because this one holds a write
    # queue of up to 16,384 records and compiles Typst reports.
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 512M
    # The binary probes itself, since the scratch images here have no shell for a
    # check to call, and `restart` only catches a process that has exited.
    healthcheck:
      test: ["CMD", "/app", "-healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    # This site does not replace the json-file driver, it reads a copy, so stdout
    # stays the source of truth and stays rotated.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks: [edge]

volumes:
  data:
    name: orchard-logging-data

networks:
  edge:
    name: orchard-edge
    external: true
