<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ .Title }} · {{ .SiteName }}</title>
  <meta name="description" content="{{ .Description }}">
  <link rel="canonical" href="{{ .Canonical }}">
  <!-- Not a public site, a search engine holding a copy of this is a thing
       nobody asked for. -->
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" type="image/svg+xml" href="/favicon.ico">

  {{ if .JSONLD }}<script type="application/ld+json">{{ .JSONLD }}</script>{{ end }}

  {{ template "extra_head" . }}

  {{ range .Styles }}<link href="{{ . }}" rel="stylesheet">{{ end }}
  {{ template "extra_css" . }}

  <script>
    (function (m, e, t, r, i, c, s) {
      m.collectorQueue = m.collectorQueue || r;
      m.collectorServer = c;
      m.collectorId = s;
      m.collectorScript = e.createElement(t);
      m.collectorScript.src = c + i;
      e.head.appendChild(m.collectorScript);
    })(window, document, "script", [], "/static/collector.js",
       "https://analytics.bythewood.me", "{{ .AnalyticsID }}");
  </script>
</head>

<body>
  {{ template "nav" . }}

  {{ template "breadcrumb_bar" . }}

  <main>
    {{ template "main" . }}
  </main>

  {{ template "footer" . }}

  <script type="module" src="{{ .Script }}"></script>
  {{ template "extra_js" . }}
</body>
</html>
