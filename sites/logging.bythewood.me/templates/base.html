<!doctype html>
<html lang="en">
<head>
  {{ template "suite-head" }}
  <title>{{ .Title }} · {{ .SiteName }}</title>
  <meta name="description" content="{{ .Description }}">
  <link rel="canonical" href="{{ .Canonical }}">
  <!-- Not a public site, a search engine holding a copy of this is a thing
       nobody asked for. -->
  <meta name="robots" content="noindex, nofollow">

  {{ if .JSONLD }}<script type="application/ld+json">{{ .JSONLD }}</script>{{ end }}

  {{ template "extra_head" . }}

  {{ range .Styles }}<link href="{{ . }}" rel="stylesheet">{{ end }}
  {{ template "extra_css" . }}

  <script src="https://analytics.bythewood.me/static/collector.js" data-collector-id="{{ .AnalyticsID }}" async></script>
</head>

<body class="o-body">
  {{ template "suite-top" .Suite }}

  {{ template "main" . }}

  {{ template "footer" . }}

  <script type="module" src="{{ .Script }}"></script>
  {{ template "extra_js" . }}
</body>
</html>
