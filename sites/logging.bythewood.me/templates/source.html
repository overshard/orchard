{{ define "extra_css" }}{{ range .PageStyles }}<link href="{{ . }}" rel="stylesheet">{{ end }}{{ end }}

{{ define "extra_js" }}
{{ with .Dash }}
<script id="chart-volume" type="application/json">{{ json .Graph }}</script>
<script id="chart-levels" type="application/json">{{ json .ByLevel }}</script>
<script id="chart-status" type="application/json">{{ json .StatusClasses }}</script>
{{ end }}
<script type="module" src="{{ .PageScript }}"></script>
{{ end }}

{{ define "main" }}
{{ with .Dash }}
<main id="main" class="o-wrap o-main">
  {{ template "dashTop" . }}
  {{ template "dashPanels" . }}
</main>
{{ end }}
{{ end }}
