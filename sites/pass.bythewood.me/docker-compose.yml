name: orchard-pass

# Caddy sends the Bitwarden apps' paths to vw and everything else to the page.
# The page reads Vaultwarden's database out of the same volume, and writes
# only the authenticator setting and its own event rows.

x-hardening: &hardening
  restart: unless-stopped
  stop_grace_period: 30s
  security_opt:
    - no-new-privileges:true
  read_only: true
  cap_drop: [ALL]
  tmpfs: ["/tmp:size=16m,noexec,nosuid,nodev"]
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  vw:
    <<: *hardening
    build:
      context: .
      dockerfile: Dockerfile
      target: vw
    container_name: orchard-pass-vw
    networks: [pass]
    environment:
      DOMAIN: https://pass.bythewood.me
      # Off unless switched on from the account page, which saves it in
      # config.json through the admin API, and that wins over this.
      SIGNUPS_ALLOWED: "false"
      INVITATIONS_ALLOWED: "false"
      ORG_CREATION_USERS: none
      EMERGENCY_ACCESS_ALLOWED: "false"
      # A Send link opens in the web vault, which isn't here.
      SENDS_ALLOWED: "false"
      # Five sign in tries a minute per address. These paths skip gate, so this
      # is the limit, and every miss is pushed to the phone too.
      LOGIN_RATELIMIT_MAX_BURST: "5"
      PASSWORD_HINTS_ALLOWED: "false"
      SHOW_PASSWORD_HINT: "false"
      WEB_VAULT_ENABLED: "false"
      # The admin API is only for the page, over the bridge. Caddy never routes
      # /admin, and this is the Argon2 hash of the page's PASS_ADMIN_TOKEN.
      ADMIN_TOKEN: ${PASS_ADMIN_HASH:?set it in .env, see .env.example}
      # The user events with addresses only go in the database with this on,
      # and the page reads them from there.
      ORG_EVENTS_ENABLED: "true"
      EVENTS_DAYS_RETAIN: "90"
      IP_HEADER: X-Real-IP
      LOG_LEVEL: warn
      PUSH_ENABLED: ${PASS_PUSH_ENABLED:-false}
      PUSH_INSTALLATION_ID: ${PASS_PUSH_INSTALLATION_ID:-}
      PUSH_INSTALLATION_KEY: ${PASS_PUSH_INSTALLATION_KEY:-}
    volumes:
      - data:/data
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 192M
          pids: 128
    healthcheck:
      test: ["CMD", "/probe", "-probe", "http://127.0.0.1:8000/alive"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  app:
    <<: *hardening
    build:
      context: .
      dockerfile: Dockerfile
      target: app
    container_name: orchard-pass
    networks: [edge, pass]
    environment:
      LOGGING_TOKEN: ${LOGGING_TOKEN:?run make logging-token}
      NTFY_TOKEN: ${NTFY_TOKEN:-}
      PASS_VAULT: /vw/db.sqlite3
      PASS_ADMIN_TOKEN: ${PASS_ADMIN_TOKEN:-}
    # Writable for the authenticator row, and for the -shm file SQLite needs
    # to read a WAL database. Reads go through a read only handle.
    volumes:
      - data:/vw
    depends_on:
      vw:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 128M
          pids: 128
    healthcheck:
      test: ["CMD", "/app", "-healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  data:
    name: orchard-pass-data

networks:
  edge:
    name: orchard-edge
    external: true
  pass:
    name: orchard-pass
    external: true
