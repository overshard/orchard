name: orchard-dns

# The site and DoH are reached through Caddy like every other site. The DoT
# front is the one container here with a published port, 853 on IPv4, and it
# holds only the certificate, read only. acme alone holds the Cloudflare token
# and listens on nothing, and unbound sits on its own network with the app.

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: orchard-dns
    restart: unless-stopped
    stop_grace_period: 30s
    environment:
      LOGGING_TOKEN: ${LOGGING_TOKEN:?run make logging-token}
      DNS_DATA: /data
      DNS_TLS: /tls
      DNS_BRIDGE_PASSWORD: ${DNS_BRIDGE_PASSWORD:?run make env}
      # A list rebuild holds the old and new tables at once, so GC harder
      # before the 320M limit and not after.
      GOMEMLIMIT: 240MiB
    volumes:
      - data:/data
      - tls:/tls:ro
      - control:/run/unbound-ctl
    depends_on:
      unbound:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 320M
          pids: 128
    healthcheck:
      test: ["CMD", "/app", "-healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    read_only: true
    cap_drop: [ALL]
    tmpfs: ["/tmp:size=16m,noexec,nosuid,nodev"]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks: [edge, inner]

  dot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: orchard-dns-dot
    command: ["-dot"]
    restart: unless-stopped
    stop_grace_period: 30s
    environment:
      LOGGING_TOKEN: ${LOGGING_TOKEN:?run make logging-token}
      DNS_TLS: /tls
      DNS_BRIDGE_PASSWORD: ${DNS_BRIDGE_PASSWORD:?run make env}
    ports:
      - "0.0.0.0:853:8853/tcp"
    volumes:
      - tls:/tls:ro
    depends_on:
      app:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 96M
          pids: 128
    healthcheck:
      test: ["CMD", "/app", "-healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    read_only: true
    cap_drop: [ALL]
    tmpfs: ["/tmp:size=16m,noexec,nosuid,nodev"]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks: [edge]

  acme:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: orchard-dns-acme
    command: ["-acme"]
    restart: unless-stopped
    stop_grace_period: 30s
    environment:
      LOGGING_TOKEN: ${LOGGING_TOKEN:?run make logging-token}
      DNS_TLS: /tls
      DNS_ACME: /acme
      CLOUDFLARE_TOKEN: ${CLOUDFLARE_TOKEN:-}
    volumes:
      - tls:/tls
      - acme:/acme
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 48M
          pids: 32
    healthcheck:
      test: ["CMD", "/app", "-healthcheck"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    read_only: true
    cap_drop: [ALL]
    tmpfs: ["/tmp:size=16m,noexec,nosuid,nodev"]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks: [edge]

  unbound:
    build:
      context: ./unbound
      dockerfile: Dockerfile
    container_name: orchard-dns-unbound
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 160M
          pids: 64
    security_opt:
      - no-new-privileges:true
    read_only: true
    cap_drop: [ALL]
    tmpfs:
      - /tmp:size=16m,noexec,nosuid,nodev
      - /var/lib/unbound:mode=1777,size=16m,noexec,nosuid,nodev
    volumes:
      - control:/run/unbound-ctl
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks: [inner]

volumes:
  data:
    name: orchard-dns-data
  tls:
    name: orchard-dns-tls
  acme:
    name: orchard-dns-acme
  # unbound's control socket. tmpfs, so a stale socket never outlives a reboot,
  # and owned by 65532 with mode 0700, so only unbound and the app get in.
  control:
    name: orchard-dns-control
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: uid=65532,gid=65532,mode=0700

# unbound's access-control names this subnet, so it's fixed, and kept off
# Docker's 172.17-31 pools and wireguard's 10.77.
networks:
  edge:
    name: orchard-edge
    external: true
  inner:
    name: orchard-dns-inner
    ipam:
      config:
        - subnet: 10.53.53.0/24
