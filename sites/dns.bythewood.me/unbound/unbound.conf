# orchard-dns sends every lookup it lets through here. Only the app shares
# orchard-dns-inner with it, and nothing is published. do-ip6 stays off since
# the VPS has no IPv6 address to recurse from.
server:
	interface: 0.0.0.0@5353
	port: 5353
	do-ip6: no
	access-control: 0.0.0.0/0 refuse
	access-control: 10.53.53.0/24 allow
	access-control: 127.0.0.0/8 allow

	username: ""
	chroot: ""
	directory: "/etc/unbound"
	pidfile: ""
	use-syslog: no
	logfile: ""
	verbosity: 1
	num-threads: 1
	so-reuseport: no
	so-sndbuf: 0

	root-hints: "/usr/share/dns/root.hints"
	auto-trust-anchor-file: "/var/lib/unbound/root.key"

	qname-minimisation: yes
	harden-glue: yes
	harden-dnssec-stripped: yes
	harden-below-nxdomain: yes
	harden-algo-downgrade: no
	unwanted-reply-threshold: 10000000
	aggressive-nsec: yes
	hide-identity: yes
	hide-version: yes
	minimal-responses: yes
	edns-buffer-size: 1232

	msg-cache-size: 16m
	rrset-cache-size: 32m
	key-cache-size: 8m
	neg-cache-size: 4m
	prefetch: yes
	prefetch-key: yes

	# RFC 8767, an expired answer is better than none while a domain's
	# servers are slow or down.
	serve-expired: yes
	serve-expired-ttl: 86400
	serve-expired-client-timeout: 1800

	# A public name answering with a private address is how DNS rebinding
	# reaches a home router from a web page, so those answers are dropped.
	private-address: 10.0.0.0/8
	private-address: 172.16.0.0/12
	private-address: 192.168.0.0/16
	private-address: 169.254.0.0/16
	private-address: 127.0.0.0/8
	private-address: 100.64.0.0/10
	private-address: fd00::/8
	private-address: fe80::/10
	private-address: ::ffff:0:0/96

	extended-statistics: yes
	statistics-cumulative: no

# The socket is for the healthcheck. The TCP one is for the app to read
# stats_noreset over the inner network, with no cert since only it can reach it.
remote-control:
	control-enable: yes
	control-interface: /run/unbound/unbound.ctl
	control-interface: 0.0.0.0
	control-port: 8953
	control-use-cert: no
