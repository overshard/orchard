# orchard-dns sends every lookup it lets through here. Nothing else can reach
# it, it's on the bridge with no published port.
server:
	interface: 0.0.0.0@5353
	port: 5353
	do-ip6: no
	access-control: 0.0.0.0/0 refuse
	access-control: 10.0.0.0/8 allow
	access-control: 172.16.0.0/12 allow
	access-control: 192.168.0.0/16 allow
	access-control: 127.0.0.0/8 allow

	username: ""
	chroot: ""
	directory: "/etc/unbound"
	pidfile: ""
	use-syslog: no
	logfile: ""
	verbosity: 1
	num-threads: 1
	so-reuseport: no
	so-sndbuf: 0

	root-hints: "/usr/share/dns/root.hints"
	auto-trust-anchor-file: "/var/lib/unbound/root.key"

	qname-minimisation: yes
	harden-glue: yes
	harden-dnssec-stripped: yes
	harden-below-nxdomain: yes
	aggressive-nsec: yes
	hide-identity: yes
	hide-version: yes
	minimal-responses: yes
	edns-buffer-size: 1232

	msg-cache-size: 16m
	rrset-cache-size: 32m
	key-cache-size: 8m
	neg-cache-size: 4m
	prefetch: yes
	prefetch-key: yes

	# RFC 8767, an expired answer is better than none while a domain's
	# servers are slow or down.
	serve-expired: yes
	serve-expired-ttl: 86400
	serve-expired-client-timeout: 1800

remote-control:
	control-enable: yes
	control-interface: /run/unbound/unbound.ctl
