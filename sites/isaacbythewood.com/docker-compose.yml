name: orchard-isaacbythewood

# No published ports and no state. Bind mounts would not work here anyway: the
# Docker CLI talks to Docker Desktop, which mounts a /home/dev path empty
# instead of erroring.

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: orchard-isaacbythewood
    restart: unless-stopped
    # Longer than Docker's 10s default, because shutdown drains the log shipper
    # queue. Without it a slow drain means SIGKILL.
    stop_grace_period: 30s
    # A ceiling to fail against rather than a target, since this machine is also
    # a workstation.
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 192M
    # The binary probes itself, since the scratch images here have no shell for a
    # check to call, and `restart` only catches a process that has exited.
    healthcheck:
      test: ["CMD", "/app", "-healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    # Otherwise container logs grow unbounded on a workstation.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks: [edge]

networks:
  edge:
    name: orchard-edge
    external: true
