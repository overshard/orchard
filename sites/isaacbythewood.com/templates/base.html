<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Whether the opening curtain plays has to be known before the first
         paint, or it flashes on and then vanishes. That rules out the module
         bundle, which is deferred by definition, so this is the one thing on
         the page that has to be a blocking inline script. It touches no layout,
         so it costs nothing measurable.

         The curtain is cover for a cold first paint: fetching the CSS, the
         bundle, the fonts and a hero image. So the question it has to answer is
         "does this browser already have those bytes", and the honest proxy for
         that is the bundle's own content hash. Every file under /static/ is
         served immutable for a year, so a browser that has fetched THIS build
         still has it; a deploy changes the hash, which is exactly when the
         browser has to download everything again and exactly when the opening
         is worth watching.

         That is why this is localStorage keyed on the build rather than a
         sessionStorage "have I been here this tab" flag. A new tab an hour
         later loads instantly off cache and should not sit through a curtain
         covering nothing, while a genuinely cold load after a deploy should.
         The seven day window is for the case the flag cannot see: browsers
         evict the HTTP cache long before they evict localStorage, so a visit a
         week later is treated as cold whatever the hash says.

         The try/catch is for private modes and blocked storage, where reading
         throws. Falling back to playing the curtain is right: a context with no
         storage is almost always a fresh one with nothing cached either. -->
    <script>
      (function () {
        var build = "{{ .Script }}";
        var week = 7 * 24 * 60 * 60 * 1000;
        try {
          var seen = JSON.parse(localStorage.getItem("ib.build") || "null");
          if (seen && seen.b === build && Date.now() - seen.t < week) {
            document.documentElement.dataset.returning = "true";
          }
          // Stamped on every load, so the window is "a week since you were
          // last here" rather than "a week since you first arrived".
          localStorage.setItem(
            "ib.build",
            JSON.stringify({ b: build, t: Date.now() }),
          );
        } catch (e) {}
      })();
    </script>

    <title>{{ .Title }}</title>
    <meta name="description" content="{{ .Description }}" />
    <link rel="canonical" href="{{ .Canonical }}" />
    {{- if .Staging }}
    <!-- The test hostname must never be indexed: it would compete with the
         real site as a byte-for-byte duplicate. -->
    <meta name="robots" content="noindex, nofollow" />
    {{- end }}

    <meta name="theme-color" content="{{ .ThemeColor }}" />
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg" />
    <link rel="icon" href="/favicon.ico" />
    <link rel="manifest" href="/manifest.json" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="{{ .Title }}" />
    <meta property="og:description" content="{{ .Description }}" />
    <meta property="og:url" content="{{ .Canonical }}" />

    {{- range .Styles }}
    <link rel="stylesheet" href="{{ . }}" />
    {{- end }}
    <script type="module" src="{{ .Script }}"></script>
    {{- if .Analytics }}
    <script>
      (function (m, e, t, r, i, c, s) {
        m.collectorQueue = m.collectorQueue || r;
        m.collectorServer = c;
        m.collectorId = s;
        m.collectorScript = e.createElement(t);
        m.collectorScript.src = c + i;
        e.head.appendChild(m.collectorScript);
      })(window, document, "script", [], "/static/collector.js",
         "https://analytics.bythewood.me",
         "30e69c06-9beb-4283-8919-8c7a686ab013");
    </script>
    {{- end }}
  </head>

  <body data-page="{{ .Page }}">
    <!-- The custom cursor. Hidden under 1024px, where there is no pointer to
         replace. -->
    <div class="cursor">
      <svg
        width="16"
        height="16"
        viewBox="0 0 16 16"
        fill="#ff2d2d"
        fill-opacity="0.9"
        xmlns="http://www.w3.org/2000/svg"
      >
        <circle cx="8" cy="8" r="8" />
      </svg>
    </div>
    <div class="cursor-circle"></div>

    <div class="loader" {{ if .LoaderWaits }}data-wait="true"{{ end }} aria-hidden="true">
      <div class="loader-column"></div>
      <div class="loader-column"></div>
      <div class="loader-column"></div>
      <div class="loader-column"></div>
      <div class="loader-column"></div>
      <div class="loader-column"></div>
      <div class="loader-indicator">
        <span class="loader-dot"></span>
        <span class="loader-dot"></span>
        <span class="loader-dot"></span>
      </div>
    </div>

    <nav class="nav">
      <a href="/" class="nav-logo" aria-label="Back to home"><span aria-hidden="true"></span></a>
      <a href="/contact" class="nav-contact">Get in touch</a>
      <div class="nav-current">{{ .Num }}</div>
    </nav>

    <button class="menu-hamburger" aria-label="Menu" aria-expanded="false" type="button">
      <div class="menu-patty" style="width: 15px"></div>
      <div class="menu-patty"></div>
      <div class="menu-patty" style="width: 20px"></div>
    </button>

    <div class="menu-overlay">
      <div class="menu-overlayGrid">
        <div class="menu-overlayGridLeft">
          <div class="menu-topBar">
            {{- range .TopLinks }}
            <a class="menu-topLink" href="{{ .Href }}" target="_blank" rel="noopener noreferrer">{{ .Label }}</a>
            {{- end }}
            <div class="menu-bar"></div>
          </div>
          {{- range .NavPages }}
          <a class="menu-overlayLink" href="{{ .Href }}" data-text="{{ .Title }}">{{ .Title }}</a>
          {{- end }}
          <div class="menu-bottomBar">
            <img src="{{ .AvatarSrc }}" alt="Isaac Bythewood" width="50" height="50" loading="lazy" decoding="async" />
            <div class="menu-bar"></div>
          </div>
        </div>
        <div class="menu-overlayGridRight">
          <!-- Loaded on first open, not on page load. loading="lazy" does not
               help here: the overlay is a full-screen fixed element sitting at
               z-index -5000, so it intersects the viewport and the browser
               fetches it anyway. That is a megabyte on every single page view
               for a panel most visitors never open. -->
          <img
            data-src="{{ .MenuSrc }}"
            data-srcset="{{ .MenuSrcset }}"
            sizes="(max-width: 767.98px) 100vw, 40vw"
            alt="#006 Molten Copper"
            decoding="async"
          />
        </div>
      </div>
    </div>

    <div class="transition">
      <div class="layout-lines" aria-hidden="true">
        <div class="layout-line" style="grid-column: 1"></div>
        <div class="layout-line" style="grid-column: 2"></div>
        <div class="layout-line" style="grid-column: 3"></div>
        <div class="layout-line" style="grid-column: 4"></div>
        <div class="layout-line" style="grid-column: 5"></div>
        <div class="layout-line" style="grid-column: 6"></div>
      </div>
      <div class="layout-area">
        <main class="page-main" style="grid-area: {{ .GridArea }}">
          {{- template "content" . }}
        </main>
      </div>
    </div>
  </body>
</html>
