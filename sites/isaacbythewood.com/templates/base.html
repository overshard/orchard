<!doctype html>
<html lang="en" data-build="{{ .Script }}">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Blocking and inline, since whether the curtain plays has to be settled
         before the first paint. Keyed on the build hash, which is what says
         whether this browser still has this build's bytes in its cache. -->
    <script>{{ earlyScript }}</script>

    <title>{{ .Title }}</title>
    <meta name="description" content="{{ .Description }}" />
    {{- if .Canonical }}
    <link rel="canonical" href="{{ .Canonical }}" />
    {{- end }}

    <meta name="theme-color" content="{{ .ThemeColor }}" />
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg" />
    <link rel="icon" href="/favicon.ico" />
    <link rel="manifest" href="/manifest.json" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Isaac Bythewood" />
    <meta property="og:title" content="{{ .Title }}" />
    <meta property="og:description" content="{{ .Description }}" />
    {{- if .Canonical }}
    <meta property="og:url" content="{{ .Canonical }}" />
    {{- end }}
    <!-- A PNG, not the SVG favicon. Every social platform refuses
         image/svg+xml here, so a vector card is a card nobody sees. -->
    <meta property="og:image" content="{{ .OGImage }}" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Isaac Bythewood, Senior Solutions Architect" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="{{ .Title }}" />
    <meta name="twitter:description" content="{{ .Description }}" />
    <meta name="twitter:image" content="{{ .OGImage }}" />

    {{- if .JSONLD }}
    <script type="application/ld+json">{{ .JSONLD }}</script>
    {{- end }}

    {{- range .Styles }}
    <link rel="stylesheet" href="{{ . }}" />
    {{- end }}
    <script type="module" src="{{ .Script }}"></script>
    <script src="https://analytics.bythewood.me/static/collector.js" data-collector-id="30e69c06-9beb-4283-8919-8c7a686ab013" async></script>
  </head>

  <body data-page="{{ .Page }}">
    <!-- The custom cursor. Hidden under 1024px, where there is no pointer to
         replace. -->
    <div class="cursor">
      <svg
        width="16"
        height="16"
        viewBox="0 0 16 16"
        fill="#ff2d2d"
        fill-opacity="0.9"
        xmlns="http://www.w3.org/2000/svg"
      >
        <circle cx="8" cy="8" r="8" />
      </svg>
    </div>
    <div class="cursor-circle"></div>

    <div class="loader" {{ if .LoaderWaits }}data-wait="true"{{ end }} aria-hidden="true">
      <div class="loader-column"></div>
      <div class="loader-column"></div>
      <div class="loader-column"></div>
      <div class="loader-column"></div>
      <div class="loader-column"></div>
      <div class="loader-column"></div>
      <div class="loader-indicator">
        <span class="loader-dot"></span>
        <span class="loader-dot"></span>
        <span class="loader-dot"></span>
      </div>
    </div>

    <nav class="nav">
      <a href="/" class="nav-logo" aria-label="Back to home"><span aria-hidden="true"></span></a>
      <a href="/contact" class="nav-contact">Get in touch</a>
      <div class="nav-current">{{ .Num }}</div>
    </nav>

    <button class="menu-hamburger" aria-label="Menu" aria-expanded="false" aria-controls="menu-overlay" type="button">
      <div class="menu-patty" style="width: 15px"></div>
      <div class="menu-patty"></div>
      <div class="menu-patty" style="width: 20px"></div>
    </button>

    <!-- The overlay is hidden by z-index and a transform rather than display
         or visibility, so its links stay in the tab order. inert takes them out
         without disturbing the z-index the slide-out depends on. -->
    <div class="menu-overlay" id="menu-overlay" inert>
      <div class="menu-overlayGrid">
        <div class="menu-overlayGridLeft">
          <div class="menu-topBar">
            {{- range .TopLinks }}
            <a class="menu-topLink" href="{{ .Href }}" target="_blank" rel="noopener noreferrer">{{ .Label }}</a>
            {{- end }}
            <div class="menu-bar"></div>
          </div>
          {{- range .NavPages }}
          <a class="menu-overlayLink" href="{{ .Href }}" data-text="{{ .Title }}">{{ .Title }}</a>
          {{- end }}
          <div class="menu-bottomBar">
            <img src="{{ .AvatarSrc }}" alt="Isaac Bythewood" width="50" height="50" loading="lazy" decoding="async" />
            <div class="menu-bar"></div>
          </div>
        </div>
        <div class="menu-overlayGridRight">
          <!-- Loaded on first open. loading="lazy" does not help, because the
               overlay is a full-screen fixed element that intersects the
               viewport, so the browser fetches the image anyway. -->
          <img
            data-src="{{ .MenuSrc }}"
            data-srcset="{{ .MenuSrcset }}"
            sizes="(max-width: 767.98px) 100vw, 40vw"
            alt="#006 Molten Copper"
            decoding="async"
          />
        </div>
      </div>
    </div>

    <div class="transition">
      <div class="layout-lines" aria-hidden="true">
        <div class="layout-line" style="grid-column: 1"></div>
        <div class="layout-line" style="grid-column: 2"></div>
        <div class="layout-line" style="grid-column: 3"></div>
        <div class="layout-line" style="grid-column: 4"></div>
        <div class="layout-line" style="grid-column: 5"></div>
        <div class="layout-line" style="grid-column: 6"></div>
      </div>
      <div class="layout-area">
        <main class="page-main" style="grid-area: {{ .GridArea }}">
          {{- template "content" . }}
        </main>
      </div>
    </div>
  </body>
</html>
