{{ define "content" }}
<div class="index-imageWrapper">
  <!-- The hero is the largest thing on the site and the only image worth
       preloading: everything else is below the fold or on another page. -->
  <img
    src="{{ .HeroSrc }}"
    srcset="{{ .HeroSrcset }}"
    sizes="100vw"
    alt="#005 Nebulas in Triangulum"
    fetchpriority="high"
    decoding="async"
  />
</div>

<!-- Filled by JS. The word animates in on arrival, exactly as it did when
     react-transition-group mounted it with appear, so rendering one here
     server-side would show a word that never played its entrance. -->
<div class="index-words"></div>

<div class="index-hero">
  <h1 class="index-name">
    <span class="index-firstName">Isaac</span>
    <span class="index-lastName">Bythewood</span>
  </h1>
  <div class="index-role">
    <span class="index-roleTitle">Senior Solutions Architect</span>
    <span class="index-roleAt">at</span>
    <span class="index-roleCompany">Craftmaster Furniture</span>
  </div>
  <a
    href="https://darkfurrow.com"
    target="_blank"
    rel="noopener noreferrer"
    class="index-notice"
  >
    <span class="index-noticeLabel">New Project</span>
    <span class="index-noticeTitle">Dark Furrow</span>
    <span class="index-noticeDesc">
      An artistic almanac blending poetry, visual rhythm, and practical wisdom
      for home gardeners and farmers.
    </span>
  </a>
</div>
{{ end }}
