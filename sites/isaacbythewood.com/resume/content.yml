# The resume, as data.
#
# The Next.js era kept this as Markdown with YAML frontmatter and parsed the
# body with `marked`, then had to recognise entry headings and date lines by
# regular expression to decide what each paragraph meant. That guessing is what
# the structure below removes: a role, its dates and its bullets are named
# fields, so the template never has to infer them from how a line is written.
#
# Em dashes are kept here on purpose. Workspace prose does not use them, but
# this file is not prose, it is a published document whose typography is being
# reproduced exactly.

