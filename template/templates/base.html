<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ .Title }} · {{ .SiteName }}</title>
  <meta name="description" content="{{ .Description }}">
  <meta name="theme-color" content="#0e0d0a">

  {{ range .Styles }}<link href="{{ . }}" rel="stylesheet">{{ end }}

  {{- if .AnalyticsID }}
  <script src="https://analytics.bythewood.me/static/collector.js" data-collector-id="{{ .AnalyticsID }}" async></script>
  {{- end }}
</head>

<body>
  <main>
    {{ template "main" . }}
  </main>

  <footer>
    <span>&copy; {{ .Year }} Isaac Bythewood · Some rights reserved</span>
    <a href="{{ .SourceURL }}">Source</a>
  </footer>

  <script type="module" src="{{ .Script }}"></script>
</body>
</html>
